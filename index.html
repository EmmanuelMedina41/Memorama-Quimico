<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Memorama Químico</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    >

</head>

<body>

    <h1 class="titulo">
        Memorama Químico
    </h1>


    <style>

        :root{
            --w: calc(95vw / 12);
            --h: calc(95vw / 9);
        }


        *{
            box-sizing: border-box;
            transition: all 0.5s;
        }


        body{
            padding: 0;
            margin: 0;
            background: lightblue;

            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family:
                'Gill Sans',
                'Gill Sans MT',
                Calibri,
                'Trebuchet MS',
                sans-serif;
        }

        .titulo{
            position: fixed;
            top: 15px;
            left: 20px;
            margin: 0;
            font-size: 28px;
            color: darkblue;
            text-shadow:
                2px 2px 4px gray;
            z-index: 10;
        }

        #tablero{
            width: 95vw;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }


        .area-tarjeta,
        .tarjeta,
        .cara{
            cursor: pointer;
            width: var(--w);
            min-width: 50px;
            height: var(--h);
        }

        .area-tarjeta{
            display: inline-block;
        }

        .tarjeta{
            position: relative;
            transform-style: preserve-3d;
            animation: iniciar 10s;
        }

        .cara{
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            box-shadow:
                inset 0 0 0 5px white;
            font-size: 120%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 5px;
            text-align: center;
            user-select: none;
        }

        .trasera{
            background: lightblue;
            transform:
                rotateY(180deg);
            font-weight: bold;
        }

        .superior{
            background:
                linear-gradient(
                    orange,
                    darkorange
                );
            color: white;
        }

        .opciones{
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: bold;
        }

        .opciones select{
            padding: 8px;
            border-radius: 10px;
            background-color: orange;
            border:
                2px solid white;
            font-size: 18px;
            cursor: pointer;
        }

        .Marca-agua{
            position: fixed;
            bottom: 10px;
            right: 15px;
            font-size: 14px;
            color: black;
            pointer-events: none;
            user-select: none;
            z-index: 10;
        }

        .nuevoJuego{
            cursor: pointer;
            background:
                linear-gradient(
                    orange,
                    darkorange
                );
            padding: 20px;
            border-radius: 50px;
            border:
                white 5px solid;
            color: white;
            font-weight: bold;
            margin-top: 20px;
            user-select: none;
        }

        .nuevoJuego:hover{
            transform:
                scale(1.05);
        }

        .encontrada{
            pointer-events: none;
        }

        @keyframes iniciar{
            0%,
            100%{
                transform:
                    rotateY(0deg);
            }

            20%,
            90%{

                transform:
                    rotateY(180deg);
            }

        }

        .fondoFinal{
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                rgba(0, 0, 0, 0.5);
            z-index: 99;
        }

        .mensajeFinal{
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform:
                translate(-50%, -50%);
            background: white;
            padding: 35px;
            border-radius: 20px;
            border:
                5px solid orange;
            box-shadow:
                0 0 30px gray;
            z-index: 100;
            min-width: 300px;
            text-align: center;
        }

        .mensajeFinal h2{
            margin-top: 0;
            color: darkorange;
            font-size: 30px;
        }

        .mensajeFinal p{
            font-size: 20px;
            color: darkblue;
        }

        .mensajeFinal button{
            background:
                linear-gradient(
                    orange,
                    darkorange
                );

            color: white;
            border:
                3px solid white;
            padding:
                12px 25px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
        }

        .mensajeFinal button:hover{
            transform:
                scale(1.08);
        }

    </style>


    <div class="opciones">

        <label for="cantidad">
            Número de cartas:
        </label>


        <select
            id="cantidad"
            onchange="generarTablero()"
        >

            <option value="24">
                24 cartas
            </option>


            <option value="48">
                48 cartas
            </option>


            <option value="64">
                64 cartas
            </option>


            <option value="102">
                102 cartas
            </option>

        </select>

    </div>


    <div id="tablero"></div>


   

    <div class="Marca-agua">

        Emmanuel Medina Lopez

    </div>


    <div
        class="nuevoJuego"
        onclick="generarTablero()"
    >

        Nuevo Juego

    </div>

    <div
        id="fondoFinal"
        class="fondoFinal"
    ></div>


    <div
        id="mensajeFinal"
        class="mensajeFinal"
    >

        <h2>
            ¡Felicidades!
        </h2>


        <p>
            ¡Completaste el Memorama Químico!
        </p>


        <button
            onclick="generarTablero()"
        >

             Jugar otra vez

        </button>

    </div>



    <script>



        let iconos = [];

        let selecciones = [];

        let bloqueado = false;

        let parejasEncontradas = 0;

        let totalParejas = 0;


        function cargariconos(){

            iconos = [

                {
                    corto: "Li",
                    largo: "Litio"
                },

                {
                    corto: "Na",
                    largo: "Sodio"
                },

                {
                    corto: "K",
                    largo: "Potasio"
                },

                {
                    corto: "Fe",
                    largo: "Hierro"
                },

                {
                    corto: "Cu",
                    largo: "Cobre"
                },

                {
                    corto: "Ag",
                    largo: "Plata"
                },

                {
                    corto: "Au",
                    largo: "Oro"
                },

                {
                    corto: "Be",
                    largo: "Berilio"
                },

                {
                    corto: "Mg",
                    largo: "Magnesio"
                },

                {
                    corto: "Ca",
                    largo: "Calcio"
                },

                {
                    corto: "Rb",
                    largo: "Rubidio"
                },

                {
                    corto: "Sr",
                    largo: "Estroncio"
                },

                {
                    corto: "Cs",
                    largo: "Cesio"
                },

                {
                    corto: "Ba",
                    largo: "Bario"
                },

                {
                    corto: "Fr",
                    largo: "Francio"
                },

                {
                    corto: "Ra",
                    largo: "Radio"
                },

                {
                    corto: "Sc",
                    largo: "Escandio"
                },

                {
                    corto: "Y",
                    largo: "Itrio"
                },

                {
                    corto: "La",
                    largo: "Lantano"
                },

                {
                    corto: "Ti",
                    largo: "Titanio"
                },

                {
                    corto: "Zr",
                    largo: "Zirconio"
                },

                {
                    corto: "Hf",
                    largo: "Hafnio"
                },

                {
                    corto: "V",
                    largo: "Vanadio"
                },

                {
                    corto: "Nb",
                    largo: "Niobio"
                },

                {
                    corto: "Ta",
                    largo: "Tantalo"
                },

                {
                    corto: "Cr",
                    largo: "Cromo"
                },

                {
                    corto: "Mo",
                    largo: "Molibdeno"
                },

                {
                    corto: "W",
                    largo: "Volframio"
                },

                {
                    corto: "Mn",
                    largo: "Manganeso"
                },

                {
                    corto: "Tc",
                    largo: "Tecnecio"
                },

                {
                    corto: "Re",
                    largo: "Renio"
                },

                {
                    corto: "Ru",
                    largo: "Rutenio"
                },

                {
                    corto: "Os",
                    largo: "Osmio"
                },

                {
                    corto: "Co",
                    largo: "Cobalto"
                },

                {
                    corto: "Rh",
                    largo: "Rodio"
                },

                {
                    corto: "Ir",
                    largo: "Iridio"
                },

                {
                    corto: "Ni",
                    largo: "Niquel"
                },

                {
                    corto: "Pd",
                    largo: "Paladio"
                },

                {
                    corto: "Pt",
                    largo: "Platino"
                },

                {
                    corto: "Zn",
                    largo: "Zinc"
                },

                {
                    corto: "Cd",
                    largo: "Cadmio"
                },

                {
                    corto: "Hg",
                    largo: "Mercurio"
                },

                {
                    corto: "Al",
                    largo: "Aluminio"
                },

                {
                    corto: "Ga",
                    largo: "Galio"
                },

                {
                    corto: "In",
                    largo: "Indio"
                },

                {
                    corto: "Tl",
                    largo: "Talio"
                },

                {
                    corto: "Sn",
                    largo: "Estaño"
                },

                {
                    corto: "Pb",
                    largo: "Plomo"
                },

                {
                    corto: "Bi",
                    largo: "Bismuto"
                },

                {
                    corto: "Ge",
                    largo: "Germanio"
                },

                {
                    corto: "Sb",
                    largo: "Antimonio"
                },

                {
                    corto: "Po",
                    largo: "Polonio"
                }

            ];

        }

        function generarTablero(){

            parejasEncontradas = 0;

            document.getElementById(
                "mensajeFinal"
            ).style.display = "none";


            document.getElementById(
                "fondoFinal"
            ).style.display = "none";


            cargariconos();


            selecciones = [];


            bloqueado = true;


            let tablero =
                document.getElementById(
                    "tablero"
                );


            let tarjetas = [];


            let cantidad =
                Number(
                    document.getElementById(
                        "cantidad"
                    ).value
                );


            let pares =
                cantidad / 2;


            totalParejas = pares;


            iconos
            .slice(0, pares)
            .forEach(
                (
                    elemento,
                    indice
                ) => {


                    tarjetas.push(`
                        <div
                            class="area-tarjeta"
                            onclick="seleccionarTarjeta(this)"
                        >
                            <div
                                class="tarjeta"
                                data-par="${indice}"
                            >
                                <div
                                    class="cara trasera"
                                >
                                    ${elemento.corto}
                                </div>
                                <div
                                    class="cara superior"
                                >
                                    <i
                                        class="fa-solid fa-flask"
                                    ></i>
                                </div>
                            </div>
                        </div>
                    `);

                    /* SEGUNDA CARTA */

                    tarjetas.push(`
                        <div
                            class="area-tarjeta"
                            onclick="seleccionarTarjeta(this)"
                        >
                            <div
                                class="tarjeta"
                                data-par="${indice}"
                            >
                                <div
                                    class="cara trasera"
                                >
                                    ${elemento.largo}
                                </div>
                                <div
                                    class="cara superior"
                                >
                                    <i
                                        class="fa-solid fa-flask"
                                    ></i>
                                </div>
                            </div>
                        </div>
                    `);

                }
            );


            tarjetas.sort(

                () =>
                    Math.random() - 0.5

            );

            tablero.innerHTML =
                tarjetas.join("");


            setTimeout(() => {

                bloqueado = false;

            }, 5000);

        }

        function seleccionarTarjeta(
            elemento
        ){

            if(bloqueado){
                return;
            }

            if(

                elemento.classList
                .contains(
                    "encontrada"
                )

            ){
                return;
            }

            if(

                selecciones.includes(
                    elemento
                )

            ){
                return;
            }

            let tarjeta =
                elemento.querySelector(
                    ".tarjeta"
                );

            tarjeta.style.transform =
                "rotateY(180deg)";
            selecciones.push(
                elemento
            );


            if(
                selecciones.length === 2
            ){
                bloqueado = true;
                comprobarPareja();
            }

        }

        function comprobarPareja(){


            let carta1 =
                selecciones[0];
            let carta2 =
                selecciones[1];
            let tarjeta1 =
                carta1.querySelector(
                    ".tarjeta"
                );

            let tarjeta2 =
                carta2.querySelector(
                    ".tarjeta"
                );

            let par1 =
                tarjeta1.dataset.par;
            let par2 =
                tarjeta2.dataset.par;

            setTimeout(() => {

                if(
                    par1 === par2
                ){

                    carta1.classList.add(
                        "encontrada"
                    );

                    carta2.classList.add(
                        "encontrada"
                    );

                    parejasEncontradas++;
                
                    if(
                        parejasEncontradas ===
                        totalParejas){
  

                        document.getElementById(
                            "fondoFinal"
                        ).style.display = "block";


                        document.getElementById(
                            "mensajeFinal"
                        ).style.display = "block";

                        bloqueado = true;
                    }

                }

                else{
                    tarjeta1.style.transform =
                   "rotateY(0deg)";
                    tarjeta2.style.transform =
                        "rotateY(0deg)";
                }

                selecciones = [];

                if(
                    parejasEncontradas !==
                    totalParejas
                ){
                    bloqueado = false;
                }

            }, 1000);

        }

        generarTablero();
        
    </script>
</body>

</html>
